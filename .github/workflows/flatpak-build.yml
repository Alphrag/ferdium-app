# This workflow is a test to build flatpak

name: Flatpak build

on:
  # Manual trigger from the UI
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for build'
        required: true

env:
  USE_HARD_LINKS: false
  # DEBUG: @malept/flatpak-bundler
  # CHANGE: Set name to use for personal branch
  PERSONAL_BRANCH_NAME: Alphrag-local-release
  FLATPAK_BRANCH: test-flatpak

jobs:

  build_flatpak_linux:
    name: 'ubuntu ${{ github.event.inputs.message }}'
    runs-on: ubuntu-24.04
    steps:
      - name: Set env vars
        run: |
          echo "NPM_CACHE=$HOME/.npm" >> $GITHUB_ENV
          echo "ELECTRON_CACHE=$HOME/.cache/electron" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_CACHE=$HOME/.cache/electron-builder" >> $GITHUB_ENV
          echo "FLATPAK_RUNTIME_VERSION=25.08" >> $GITHUB_ENV
      - name: Checkout code along with submodules for the concerned branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Note: Needed to be able to pull the 'develop' branch as well for merging
      - name: Extract Git branch name from the currently checked out branch (not from the branch where this run was kicked off)
        run: echo "GIT_BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
        shell: bash
      - name: Cache electron modules
        uses: actions/cache@v4
        env:
          cache-name: cache-electron-modules
        with:
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('./pnpm-lock.yaml') }}
          path: ${{ env.ELECTRON_CACHE }}
      - name: Cache electron-builder modules
        uses: actions/cache@v4
        env:
          cache-name: cache-electron-builder-modules
        with:
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('./pnpm-lock.yaml') }}
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
      - name: Use Node.js specified in the '.nvmrc' file
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install node dependencies
        uses: nick-fields/retry@v3
        with:
          command: pnpm i
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
      - name: Figure out used package.json version
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        shell: bash
      - name: Package recipes
        if: ${{ !contains(github.event.inputs.message, '[no-recipes]') }}
        run: |
          pnpm i
          pnpm lint
          pnpm reformat-files
          pnpm package
        working-directory: ./recipes
      - name: Run linter and tests
        run: |
          pnpm lint
          pnpm test
      - name: Install requirements for flatpak build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            python3-gi \
            appstream-util \
            build-essential \
            libarchive-tools
      - name: Install flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -u -y org.electronjs.Electron2.BaseApp//25.08 org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build Ferdium without publish for any branch not 'nightly' and not 'release' and not the personal one
        if: ${{ !contains(github.event.inputs.message, '[publish]') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm electron-builder build --linux flatpak --publish never
        shell: bash
      # CHANGE: PUBLISH FLATPAK FILE
      - name: "Build Ferdium with publish for '${{ env.GIT_BRANCH_NAME }}' branch"
        if: ${{ contains(github.event.inputs.message, '[publish]') }}
        env:
          GH_TOKEN: ${{ secrets.FERDIUM_PUBLISH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm electron-builder build --linux flatpak --publish always
        shell: bash
